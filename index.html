<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Study Buddy</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel Compiler for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide-react@latest/dist/umd/lucide-react.min.js"></script>
</head>
<body class="bg-slate-950 text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function StudyBuddyApp() {
      const [activeTab, setActiveTab] = useState('timer');
      const [minutes, setMinutes] = useState(25);
      const [seconds, setSeconds] = useState(0);
      const [isActive, setIsActive] = useState(false);
      const [tasks, setTasks] = useState([
        { id: 1, text: 'Review Newton Laws', completed: true },
        { id: 2, text: 'Complete React App setup', completed: false }
      ]);
      const [newTask, setNewTask] = useState('');

      useEffect(() => {
        let interval = null;
        if (isActive) {
          interval = setInterval(() => {
            if (seconds > 0) {
              setSeconds(seconds - 1);
            } else if (minutes > 0) {
              setMinutes(minutes - 1);
              setSeconds(59);
            } else {
              setIsActive(false);
            }
          }, 1000);
        } else {
          clearInterval(interval);
        }
        return () => clearInterval(interval);
      }, [isActive, minutes, seconds]);

      const toggleTask = (id) => {
        setTasks(tasks.map(t => t.id === id ? { ...t, completed: !t.completed } : t));
      };

      const addTask = (e) => {
        e.preventDefault();
        if (!newTask.trim()) return;
        setTasks([...tasks, { id: Date.now(), text: newTask, completed: false }]);
        setNewTask('');
      };

      return (
        <div className="min-h-screen bg-emerald-950 text-emerald-100 flex flex-col md:flex-row">
          {/* Navigation Sidebar */}
          <aside className="w-full md:w-64 p-6 bg-emerald-900/40 border-r border-emerald-800/60 backdrop-blur-md">
            <h1 className="text-2xl font-black mb-6 tracking-tight flex items-center gap-2">
              ✨ StudyBuddy
            </h1>
            <nav className="space-y-2 font-medium">
              {['timer', 'tasks', 'goals'].map(tab => (
                <button
                  key={tab}
                  onClick={() => setActiveTab(tab)}
                  className={`w-full text-left px-4 py-2.5 rounded-xl capitalize transition-all ${
                    activeTab === tab ? 'bg-emerald-500 text-slate-950 font-bold' : 'hover:bg-white/10 opacity-70'
                  }`}
                >
                  {tab === 'timer' ? '⏱️ Study Timer' : tab === 'tasks' ? '✅ Tasks' : '🎯 Goals'}
                </button>
              ))}
            </nav>
          </aside>

          {/* Content Area */}
          <main className="flex-1 p-8 max-w-4xl">
            {activeTab === 'timer' && (
              <div className="flex flex-col items-center justify-center space-y-6 pt-12">
                <h2 className="text-3xl font-bold">Focus Timer</h2>
                <div className="text-7xl font-mono font-extrabold bg-black/30 px-12 py-8 rounded-3xl border border-emerald-800">
                  {String(minutes).padStart(2, '0')}:{String(seconds).padStart(2, '0')}
                </div>
                <div className="flex space-x-4">
                  <button
                    onClick={() => setIsActive(!isActive)}
                    className="px-8 py-3 rounded-xl bg-emerald-500 text-slate-950 font-bold text-lg hover:bg-emerald-400"
                  >
                    {isActive ? 'Pause' : 'Start'}
                  </button>
                  <button
                    onClick={() => { setIsActive(false); setMinutes(25); setSeconds(0); }}
                    className="px-6 py-3 rounded-xl border border-emerald-800 hover:bg-white/10"
                  >
                    Reset
                  </button>
                </div>
              </div>
            )}

            {activeTab === 'tasks' && (
              <div className="space-y-6">
                <h2 className="text-3xl font-bold">Study Tasks</h2>
                <form onSubmit={addTask} className="flex gap-3">
                  <input
                    type="text"
                    value={newTask}
                    onChange={(e) => setNewTask(e.target.value)}
                    placeholder="Add a new task..."
                    className="flex-1 px-4 py-2.5 rounded-xl bg-black/30 border border-emerald-800 text-sm focus:outline-none"
                  />
                  <button type="submit" className="px-5 py-2.5 rounded-xl bg-emerald-500 text-slate-950 font-bold">
                    Add
                  </button>
                </form>

                <div className="space-y-2">
                  {tasks.map(t => (
                    <div
                      key={t.id}
                      onClick={() => toggleTask(t.id)}
                      className={`p-4 rounded-xl border border-emerald-800/60 bg-emerald-900/20 cursor-pointer flex items-center justify-between ${
                        t.completed ? 'opacity-50 line-through' : ''
                      }`}
                    >
                      <span>{t.text}</span>
                      <span>{t.completed ? '✓' : '○'}</span>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {activeTab === 'goals' && (
              <div className="space-y-4">
                <h2 className="text-3xl font-bold">Target Goals</h2>
                <p className="opacity-70">Track your upcoming exams and project countdowns.</p>
                <div className="p-6 rounded-2xl border border-emerald-800 bg-emerald-900/30">
                  <h3 className="text-xl font-bold mb-1">Physics Midterm</h3>
                  <p className="text-sm opacity-60">Status: Preparation in progress (45%)</p>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<StudyBuddyApp />);
  </script>
</body>
</html>
